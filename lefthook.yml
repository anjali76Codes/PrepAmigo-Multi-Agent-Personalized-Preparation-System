pre-commit:
  parallel: true
  commands:
    backend-lint:
      glob: "backend/**/*.{ts,js,json}"
      run: cd backend && npx eslint --config eslint.config.js {staged_files} --fix && npx prettier --write {staged_files}
      stage_fixed: true

    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: cd frontend && npx eslint --config eslint.config.js {staged_files} --fix && npx prettier --write {staged_files}
      stage_fixed: true

    frontend-format:
      glob: "frontend/**/*.{css,html,json}"
      run: cd frontend && npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: cd backend && npx commitlint --edit {1}