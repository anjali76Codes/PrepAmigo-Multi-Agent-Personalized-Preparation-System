[project]
name = "prepamigo-agents"
version = "0.1.0"
description = "PrepAmigo multi-agent interview preparation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-search-results>=2.4.2",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",  # optional: only used for FAST_LLM_* compatible endpoint (e.g. Groq)
    "langgraph>=0.2.0",
    "mem0ai>=2.0.0",
    "neo4j>=5.20",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "pypdf>=6.19.0",
    "pinecone>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
    "youtube-transcript-api>=1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "motor>=3.7.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# starlette's own TestClient uses a deprecated anyio alias; nothing here to fix
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
