info:
  name: 03-trigger-interview-intelligence
  type: http
  seq: 3

http:
  method: post
  url: "{{EXPRESS-SERVICE}}/api/agent/run"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "Research the interview rounds, reported topics, question patterns, and candidate experiences for a Google SDE. Include recent publicly reported interview-process changes."
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Trigger: Interview Intelligence Agent

  Searches Google discussion/forum results, related questions, YouTube interview walkthroughs, and Google News for a company and role. Candidate reports are treated as anecdotal, with source links included in the brief.
