info:
  name: 03-trigger-interview-intelligence
  type: http
  seq: 3

http:
  method: post
  url: "{{EXPRESS-SERVICE}}/api/agent/run"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "What are the interview rounds, questions, and grading rubrics for Google L5 software engineer?"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Trigger: Interview Intelligence Agent
  
  Triggers community forum analysis (Reddit/Blind), YouTube mock interview synthesis, and round-by-round rubric extraction.
