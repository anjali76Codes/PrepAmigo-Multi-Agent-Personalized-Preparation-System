docs: |
  ## Google Forums API — Interview Experiences (Recent)
  
  Used by: Interview Intelligence Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Search query (e.g. "Stripe backend interview experience site:reddit.com")
  - `location` (Optional): Location
  - `gl` / `hl`: Country and language
  - `period_unit` + `period_value` (Optional): Recency filter (m + 6 = past 6 months)
  - `start_date` / `end_date` (Optional): `YYYYMMDD` date filter
  - `start` (Optional): Pagination offset
  - `nfpr` (Optional): `1` to exclude auto-corrected query results
  - `filter` (Optional): `1` to toggle similar results filtering
  - `no_cache` (Optional): Bypass SerpApi cache
