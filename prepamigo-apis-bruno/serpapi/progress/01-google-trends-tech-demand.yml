info:
  name: 01-google-trends-tech-demand
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERPAPI_BASE}}/search"
  params:
    - name: engine
      value: google_trends
      type: query
    - name: q
      value: "Apache Kafka,Apache Flink"
      type: query
    - name: data_type
      value: TIMESERIES
      type: query
    - name: geo
      value: "US"
      type: query
      disabled: true
    - name: date
      value: "today 12-m"
      type: query
    - name: tz
      value: "420"
      type: query
      disabled: true
    - name: hl
      value: en
      type: query
    - name: no_cache
      value: "false"
      type: query
      disabled: true
    - name: api_key
      value: "{{SERPAPI_KEY}}"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Google Trends API — Technology Industry Demand
  
  Used by: Progress Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Comma-separated technology comparison (max 5)
  - `data_type`: `TIMESERIES` (default) or `RELATED_TOPICS`
  - `geo`: Location code (or empty for Worldwide)
  - `date`: `today 12-m` (past year), `today 5-y`, `all`
  - `no_cache` (Optional): Bypass SerpApi cache
