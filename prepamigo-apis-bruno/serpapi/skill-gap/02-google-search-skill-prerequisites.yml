info:
  name: 02-google-search-skill-prerequisites
  type: http
  seq: 2

http:
  method: GET
  url: "{{SERPAPI_BASE}}/search"
  params:
    - name: engine
      value: google
      type: query
    - name: q
      value: "prerequisites for learning distributed systems for software engineers"
      type: query
    - name: location
      value: "United States"
      type: query
      disabled: true
    - name: gl
      value: us
      type: query
    - name: hl
      value: en
      type: query
    - name: tbs
      value: ""
      type: query
      disabled: true
    - name: num
      value: "10"
      type: query
      disabled: true
    - name: start
      value: "0"
      type: query
      disabled: true
    - name: no_cache
      value: "false"
      type: query
      disabled: true
    - name: api_key
      value: "{{SERPAPI_KEY}}"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Google Search API — Skill Prerequisite Chain (DAG)
  
  Used by: Skill Gap Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Prerequisite query
  - `gl` / `hl`: Country and language
  - `tbs` (Optional): Recency or filetype filter
  - `num` (Optional): Number of results
  - `no_cache` (Optional): Bypass SerpApi cache
