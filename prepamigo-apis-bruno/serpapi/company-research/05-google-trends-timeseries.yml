docs: |
  ## Google Trends API — Interest Over Time (TIMESERIES)
  
  Used by: Company Research Agent, Progress Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Term or comma-separated terms (max 5 for comparison, e.g. "Datadog,Dynatrace")
  - `data_type` (Optional): `TIMESERIES` (default), `GEO_MAP`, `GEO_MAP_0`, `RELATED_TOPICS`, `RELATED_QUERIES`
  - `geo` (Optional): Location code (e.g. `US`, `GB`, `IN`, or empty for Worldwide)
  - `region` (Optional): `COUNTRY`, `REGION`, `DMA`, `CITY`
  - `date` (Optional): `now 1-H`, `now 7-d`, `today 12-m`, `today 5-y`, `all`, or custom `yyyy-mm-dd yyyy-mm-dd`
  - `tz` (Optional): UTC offset in minutes (default 420 = PDT)
  - `cat` (Optional): Category filter ID
  - `gprop` (Optional): Property: `images`, `news`, `froogle` (Shopping), `youtube`, or empty for Web
  - `hl` (Optional): Language code
  - `no_cache` (Optional): Bypass SerpApi cache
