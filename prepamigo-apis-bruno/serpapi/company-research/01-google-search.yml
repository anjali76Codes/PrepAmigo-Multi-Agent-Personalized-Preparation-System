info:
  name: 01-google-search
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERPAPI_BASE}}/search"
  params:
    - name: engine
      value: google
      type: query
    - name: q
      value: "{{company_query}}"
      type: query
    - name: location
      value: "United States"
      type: query
      disabled: true
    - name: uule
      value: ""
      type: query
      disabled: true
    - name: google_domain
      value: google.com
      type: query
      disabled: true
    - name: gl
      value: us
      type: query
    - name: hl
      value: en
      type: query
    - name: cr
      value: ""
      type: query
      disabled: true
    - name: lr
      value: ""
      type: query
      disabled: true
    - name: tbs
      value: ""
      type: query
      disabled: true
    - name: safe
      value: active
      type: query
      disabled: true
    - name: start
      value: "0"
      type: query
      disabled: true
    - name: num
      value: "10"
      type: query
    - name: device
      value: desktop
      type: query
      disabled: true
    - name: no_cache
      value: "false"
      type: query
      disabled: true
    - name: async
      value: "false"
      type: query
      disabled: true
    - name: api_key
      value: "{{SERPAPI_KEY}}"
      type: query
  auth: none

assert:
  - expr: res.status
    operator: eq
    value: "200"
  - expr: res.body.search_metadata.status
    operator: eq
    value: Success

tests: |
  test("status is 200", function() {
    expect(res.getStatus()).to.equal(200);
  });
  test("search_metadata status is Success", function() {
    expect(res.getBody().search_metadata.status).to.equal("Success");
  });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Google Search API — Official Google Search
  
  Official SerpApi Google Search API endpoint (`engine=google`) as documented at https://serpapi.com/search-api.
  Used by: Company Research Agent (primary data source for company facts, products, tech stack, culture, and forum discussions).
  
  **Required Parameters:**
  - `engine`: `google`
  - `q`: Search query (e.g. `{{company_query}}` or `Stripe engineering blog tech stack`)
  - `api_key`: `{{SERPAPI_KEY}}`
  
  **Recommended Parameters:**
  - `num`: Number of results (default `10`)
  - `hl`: Language code (default `en`)
  - `gl`: Country code (default `us`)
  
  **Assertions:**
  - Status 200
  - `search_metadata.status == "Success"`
