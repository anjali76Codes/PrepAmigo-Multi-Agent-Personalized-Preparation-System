docs: |
  ## Google Forums API — Engineering Culture & Community Discussions
  
  Used by: Company Research Agent, Interview Intelligence Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Query (e.g. company culture, Reddit/Blind posts)
  - `location` (Optional): Search origin
  - `gl` / `hl` (Optional): Country / Language
  - `period_unit` + `period_value` (Optional): Recency filter (e.g. `m` + `6` for past 6 months)
  - `start_date` / `end_date` (Optional): `YYYYMMDD` date range
  - `start` (Optional): Pagination offset (0, 10, 20...)
  - `nfpr` (Optional): `1` to exclude auto-corrected query results
  - `filter` (Optional): `1` to toggle similar results filtering
  - `device` (Optional): `desktop`, `tablet`, `mobile`
  - `no_cache` (Optional): Bypass SerpApi cache
