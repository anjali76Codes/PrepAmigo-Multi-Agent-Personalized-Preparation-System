docs: |
  ## Google News API — Company News
  
  Used by: Company Research Agent, Interview Intelligence Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Optional): Search query
  - `gl` (Optional): Country code (`us`, `uk`, `in`, etc.)
  - `hl` (Optional): Language code (`en`, etc.)
  - `so` (Optional): Sort order: `0` = relevance (default), `1` = date (newest first)
  - `topic_token` (Optional): Scope to topic (World, Business, Tech)
  - `kgmid` (Optional): Knowledge Graph ID (`/m/...` or `/g/...`)
  - `publication_token` (Optional): Scopes results to a specific publisher
  - `section_token` (Optional): Sub-section of topic
  - `story_token` (Optional): Full coverage of one specific story
  - `no_cache` (Optional): Bypass SerpApi 1h cache
