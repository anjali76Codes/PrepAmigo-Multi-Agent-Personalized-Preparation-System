docs: |
  ## Google Search API — Company Overview

  Used by: Company Research Agent, Job Intelligence Agent (fallback), Skill Gap Agent, Research Agent, Assessment Agent, Planner Agent

  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Search query (supports `site:`, `inurl:`, `intitle:`)
  - `location` (Optional): Geographic location string
  - `uule` (Optional): Google-encoded location
  - `google_domain` (Optional): Search domain (default `google.com`)
  - `gl` (Optional): Two-letter country code (e.g. `us`)
  - `hl` (Optional): Two-letter language code (e.g. `en`)
  - `cr` / `lr` (Optional): Country / language restrict
  - `tbs` (Optional): Advanced filters (e.g. `qdr:m` past month, `qdr:y` past year)
  - `tbm` (Optional): Search vertical (`isch`, `vid`, `nws`, `shop`)
  - `safe` (Optional): `active` or `off`
  - `start` (Optional): Pagination offset (0, 10, 20...)
  - `num` (Optional): Number of results (default 10, max 100)
  - `device` (Optional): `desktop`, `tablet`, `mobile`
  - `no_cache` (Optional): `true` to force cache bypass (consumes quota)
  - `async` (Optional): `true` for async search
