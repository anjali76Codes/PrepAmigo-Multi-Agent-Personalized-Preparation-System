docs: |
  ## Google Trends API — Related Queries
  
  Used by: Company Research Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Single search term (max 1 for RELATED_QUERIES)
  - `data_type` (Required): `RELATED_QUERIES`
  - `geo` (Optional): Country code (`US`, `GB`, etc.)
  - `date` (Optional): `today 12-m`, `today 5-y`, `all`, etc.
  - `tz` (Optional): UTC offset in minutes
  - `cat` (Optional): Category filter ID
  - `gprop` (Optional): `images`, `news`, `youtube`, or empty for Web
  - `hl` (Optional): Language code
  - `no_cache` (Optional): Bypass SerpApi cache
