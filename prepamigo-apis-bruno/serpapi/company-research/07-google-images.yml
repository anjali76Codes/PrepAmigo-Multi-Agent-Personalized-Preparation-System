docs: |
  ## Google Images API — Product / Architecture Visuals
  
  Used by: Company Research Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Query (supports `site:`, `inurl:`, `intitle:`)
  - `location` / `uule` (Optional): Location
  - `google_domain` (Optional): Default `google.com`
  - `gl` / `hl` (Optional): Country / Language
  - `period_unit` + `period_value` (Optional): Recency filter (s/n/h/d/w/m/y + count)
  - `start_date` / `end_date` (Optional): `YYYYMMDD` date range
  - `chips` (Optional): Suggested search chips from prior response
  - `tbs` (Optional): Advanced filters (e.g. `sur:cl` for Creative Commons)
  - `imgar` (Optional): Aspect ratio: `s` square, `t` tall, `w` wide, `xw` panoramic
  - `imgsz` (Optional): Size filter (`l` large, `m` medium, `i` icon)
  - `image_color` (Optional): Color filter (`bw`, `red`, `blue`, etc.)
  - `image_type` (Optional): `photo`, `clipart`, `lineart`, `animated`, `face`
  - `safe` (Optional): `active` or `off`
  - `num` (Optional): Number of images (max 100)
  - `ijn` (Optional): Page number (0-99)
  - `no_cache` (Optional): Bypass SerpApi cache
