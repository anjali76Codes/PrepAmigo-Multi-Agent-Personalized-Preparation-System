docs: |
  ## Google AI Overview API — Step 1: Trigger Google Search
  
  Used by: Company Research Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Broad explanatory query likely to trigger Google's AI Overview
  - `gl` / `hl`: Country and language
  - `safe` (Optional): `active` or `off`
  - `no_cache` (Optional): Bypass SerpApi cache
  
  **Instructions:**
  1. Send this request.
  2. In the response JSON, look for `ai_overview.page_token`.
  3. Copy the token and paste it into request `10-google-ai-overview-step2-fetch.yml`.
  ⚠️ Token expires ~1 minute after this search.
