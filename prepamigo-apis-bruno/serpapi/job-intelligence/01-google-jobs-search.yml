docs: |
  ## Google Jobs API — Job Search (Step 1 of 2)
  
  Used by: Job Intelligence Agent, Skill Gap Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Job search query (e.g. "Software Engineer Google", "Backend Engineer Stripe")
  - `location` (Optional): Location filter (e.g. "New York, NY", "Remote")
  - `uule` (Optional): Google-encoded location
  - `google_domain` (Optional): Default google.com
  - `gl` / `hl`: Country and language
  - `chips` (Optional): Filter tokens (e.g. `date_posted:today`, `employment_type:FULLTIME`, `requirements:degree`)
  - `start` (Optional): Pagination offset (0, 10, 20...)
  - `no_cache` (Optional): Bypass SerpApi cache
  
  **After running:** Copy `job_id` from `jobs_results[]` and paste into `02-google-jobs-listing.yml`.
