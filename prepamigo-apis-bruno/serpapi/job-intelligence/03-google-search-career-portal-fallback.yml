docs: |
  ## Google Search API — Career Portal Fallback
  
  Used by: Job Intelligence Agent (fallback when google_jobs returns 0 results)
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Targeted ATS search (e.g. `site:careers.stripe.com "Backend Engineer"`, `site:boards.greenhouse.io/datadog`)
  - `gl` / `hl`: Country and language
  - `tbs` (Optional): Recency filter (`qdr:m` past month, `qdr:w` past week)
  - `num` (Optional): Number of results
  - `start` (Optional): Pagination offset
  - `no_cache` (Optional): Bypass SerpApi cache
