info:
  name: 01-google-search-recruiting-timeline
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERPAPI_BASE}}/search"
  params:
    - name: engine
      value: google
      type: query
    - name: q
      value: "Google interview process timeline how long between rounds site:reddit.com"
      type: query
    - name: location
      value: "United States"
      type: query
      disabled: true
    - name: gl
      value: us
      type: query
    - name: hl
      value: en
      type: query
    - name: tbs
      value: "qdr:y"
      type: query
      disabled: true
    - name: num
      value: "10"
      type: query
      disabled: true
    - name: no_cache
      value: "false"
      type: query
      disabled: true
    - name: api_key
      value: "{{SERPAPI_KEY}}"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Google Search API — Recruiting Timeline Validation
  
  Used by: Planner Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Recruiting turnaround timeline query
  - `gl` / `hl`: Country and language
  - `tbs` (Optional): Filter (e.g. `qdr:y` for past year)
  - `no_cache` (Optional): Bypass SerpApi cache
