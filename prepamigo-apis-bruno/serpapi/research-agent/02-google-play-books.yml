info:
  name: 02-google-play-books
  type: http
  seq: 2

http:
  method: GET
  url: "{{SERPAPI_BASE}}/search"
  params:
    - name: engine
      value: google_play_books
      type: query
    - name: q
      value: "Designing Data-Intensive Applications"
      type: query
    - name: gl
      value: us
      type: query
    - name: hl
      value: en
      type: query
    - name: print_type
      value: books
      type: query
      disabled: true
    - name: no_cache
      value: "false"
      type: query
      disabled: true
    - name: api_key
      value: "{{SERPAPI_KEY}}"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  ## Google Play Books API — Textbook Discovery
  
  Used by: Research Agent
  
  **Documented Parameters (check box to enable in Params tab):**
  - `q` (Required): Book title or technical topic
  - `gl` / `hl`: Country and language
  - `print_type` (Optional): `books` (default) or `magazines`
  - `no_cache` (Optional): Bypass SerpApi cache
