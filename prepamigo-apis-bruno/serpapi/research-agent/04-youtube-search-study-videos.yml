      value: youtube
      type: query
    - name: search_query
      value: "Kafka architecture animated explanation"
      type: query
    - name: gl
      value: us
      type: query
    - name: hl
      value: en
      type: query
    - name: sp
      value: ""
      type: query
      disabled: true
