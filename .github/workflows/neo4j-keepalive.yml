name: Keep Neo4j active

on:
  schedule:
    # AuraDB Free pauses after three days without database activity.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NEO4J_URI is deliberately required: local/in-memory graph deployments need no job.
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
    steps:
      - name: Skip when Neo4j is not configured
        if: ${{ env.NEO4J_URI == '' || env.NEO4J_PASSWORD == '' }}
        run: echo "Neo4j credentials are not configured; skipping Neo4j keep-alive."
      - if: ${{ env.NEO4J_URI != '' && env.NEO4J_PASSWORD != '' }}
        uses: actions/checkout@v4
      - if: ${{ env.NEO4J_URI != '' && env.NEO4J_PASSWORD != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Neo4j driver
        if: ${{ env.NEO4J_URI != '' && env.NEO4J_PASSWORD != '' }}
        run: python -m pip install "neo4j>=5.20,<7"
      - name: Run read-only Cypher probe
        if: ${{ env.NEO4J_URI != '' && env.NEO4J_PASSWORD != '' }}
        run: python agents-service/scripts/neo4j_ping.py
