name: Bug report
description: Report a reproducible problem in PrepAmigo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check for an existing issue. Do not include API keys, tokens, private URLs, resumes, or other personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and where you encountered it.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Submit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Redact secrets and personal information.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Frontend
        - Backend API
        - Python agent service
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, runtime, browser, and service versions.
      placeholder: Windows 11, Node.js 22, Python 3.12, Chrome ...
    validations:
      required: false
